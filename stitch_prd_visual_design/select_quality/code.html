<script>
        // Simple script to handle radio button visual selection logic purely for demonstration
        const labels = document.querySelectorAll('label:has(input[type="radio"])');
        
        labels.forEach(label => {
            label.addEventListener('click', () => {
                // Reset all
                labels.forEach(l => {
                    l.classList.remove('border-primary', 'bg-primary/5', 'border-[1.5px]');
                    l.classList.add('border-outline-variant', 'bg-surface-container-lowest', 'border');
                    
                    const outerCircle = l.querySelector('.w-5.h-5');
                    outerCircle.classList.remove('border-primary');
                    outerCircle.classList.add('border-outline-variant');
                    
                    const innerDot = l.querySelector('.bg-primary');
                    if(innerDot) innerDot.remove();
                });

                // Set active
                label.classList.add('border-primary', 'bg-primary/5', 'border-[1.5px]');
                label.classList.remove('border-outline-variant', 'bg-surface-container-lowest', 'border');
                
                const outerCircle = label.querySelector('.w-5.h-5');
                outerCircle.classList.add('border-primary');
                outerCircle.classList.remove('border-outline-variant');
                
                if(!label.querySelector('.bg-primary')) {
                    const dot = document.createElement('div');
                    dot.className = 'w-2.5 h-2.5 rounded-full bg-primary';
                    outerCircle.appendChild(dot);
                }
            });
        });
    </script>
