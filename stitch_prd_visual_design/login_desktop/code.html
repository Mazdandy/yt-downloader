<body class="bg-surface text-on-surface h-full flex flex-col font-body-lg">
<!-- TopNavBar (Suppressed for transactional screen per instructions, but requirements say use {{DATA:COMPONENTS:COMPONENTS_13}} for TopNavBar with Back to Home. Will implement as a simplified header per standard auth flows, but using the JSON properties) -->
<header class="bg-surface dark:bg-surface w-full px-gutter py-stack-md flex justify-between items-center max-w-auth-container-width mx-auto">
<div class="text-headline-md font-headline-md text-on-surface dark:text-inverse-on-surface font-bold tracking-tight">
            VideoFlow
        </div>
<a class="text-on-surface-variant dark:text-on-surface-variant font-body-lg text-body-lg flex items-center gap-1 hover:text-primary dark:hover:text-primary-fixed-dim transition-colors" href="#">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
            Back to Home
        </a>
</header>
<!-- Main Content -->
<main class="flex-grow flex items-center justify-center p-4">
<div class="w-full max-w-auth-container-width bg-surface border border-outline-variant/30 rounded p-[40px]">
<div class="text-center mb-stack-xl">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-stack-sm">Sign in to VibeDownloader</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Enter your email to continue</p>
</div>
<form action="#" class="space-y-stack-lg" method="POST">
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-stack-xs uppercase tracking-wider" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-[#F4F4F5] border border-transparent focus:border-primary-container focus:ring-0 text-on-surface font-body-lg text-body-lg rounded px-4 py-3 transition-colors duration-200 outline-none" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<button class="w-full bg-primary-container text-on-primary font-body-lg text-body-lg font-medium rounded py-3 flex items-center justify-center gap-2 hover:bg-primary transition-all duration-200 active:scale-98" type="submit">
                    Continue with Email
                </button>
</form>
<div class="mt-stack-lg text-center">
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors" href="#">
                    Don't have an account? <span class="text-primary font-medium">Create one</span>
</a>
</div>
</div>
</main>
<!-- Footer -->
<footer class="bg-surface dark:bg-surface flex flex-col items-center gap-stack-sm w-full py-stack-lg border-t border-outline-variant/20 mt-auto">
<div class="text-label-bold font-label-bold text-on-surface">VideoFlow</div>
<div class="flex gap-6">
<a class="text-on-secondary-container dark:text-on-secondary-container font-body-sm text-body-sm hover:underline hover:text-primary dark:hover:text-primary-fixed-dim transition-colors" href="#">Privacy Policy</a>
<a class="text-on-secondary-container dark:text-on-secondary-container font-body-sm text-body-sm hover:underline hover:text-primary dark:hover:text-primary-fixed-dim transition-colors" href="#">Terms of Service</a>
<a class="text-on-secondary-container dark:text-on-secondary-container font-body-sm text-body-sm hover:underline hover:text-primary dark:hover:text-primary-fixed-dim transition-colors" href="#">Help Center</a>
</div>
<div class="font-body-sm text-body-sm text-secondary dark:text-secondary-fixed-dim mt-stack-xs">
            © 2024 VideoFlow. All rights reserved.
        </div>
</footer>
<script>
        // Simple form interaction
        const form = document.querySelector('form');
        const button = form.querySelector('button');
        const input = document.getElementById('email');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            if(input.value) {
                const originalText = button.innerHTML;
                button.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
                button.classList.add('opacity-70', 'cursor-not-allowed');
                
                // Simulate network request
                setTimeout(() => {
                    button.innerHTML = originalText;
                    button.classList.remove('opacity-70', 'cursor-not-allowed');
                    
                    // Show success toast (simulated)
                    const toast = document.createElement('div');
                    toast.className = 'fixed bottom-8 left-1/2 -translate-x-1/2 bg-on-surface text-on-primary px-6 py-3 rounded font-body-sm text-body-sm shadow-lg transition-opacity duration-300 z-50';
                    toast.textContent = 'Check your email for a login link.';
                    document.body.appendChild(toast);
                    
                    setTimeout(() => {
                        toast.classList.add('opacity-0');
                        setTimeout(() => toast.remove(), 300);
                    }, 3000);
                    
                }, 1500);
            }
        });
    </script>
